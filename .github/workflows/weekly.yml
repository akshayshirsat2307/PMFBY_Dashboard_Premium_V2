name: Weekly PMFBY Data Download

on:
  # Allows you to test the job manually
  workflow_dispatch:

  schedule:
    # Weekly schedule
    - cron: "30 3 * * 1"

permissions:
  contents: write

jobs:
  download-pmfby-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Chrome
        run: |
          google-chrome --version

      - name: Download PMFBY district data
        run: |
          RUN_DATE=$(date +'%Y-%m-%d')

          python main.py \
            --year 2026 \
            --season Kharif \
            --scheme BOTH \
            --drill-to-district \
            --retries 3 \
            --output "pmfby_2026_kharif_${RUN_DATE}.csv"

      - name: Show generated files
        run: |
          ls -lh data/
          
      - name: Upload CSV as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmfby-weekly-data
          path: data/*.csv
          
      - name: Commit weekly CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No new PMFBY data to commit."
          else
            git commit -m "Update weekly PMFBY data"
            git push
          fi
