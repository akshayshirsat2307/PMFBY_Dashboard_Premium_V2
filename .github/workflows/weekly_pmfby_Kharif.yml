name: Weekly PMFBY Download and Email- Kharif

on:
  # Allows manual testing from the GitHub Actions page
  workflow_dispatch:

  # Weekly scheduled execution
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: write

jobs:
  pmfby-weekly-job:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # 1. Download repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Install Python
      # ----------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ----------------------------------------------------------
      # 3. Install Python packages
      # ----------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------------------------
      # 4. Verify Chrome
      # ----------------------------------------------------------
      - name: Check Chrome
        run: |
          google-chrome --version

      # ----------------------------------------------------------
      # 5. Create data directory
      # ----------------------------------------------------------
      - name: Create data directory
        run: |
          mkdir -p data

      # ----------------------------------------------------------
      # 6. Run PMFBY scraper
      # ----------------------------------------------------------
      - name: Download PMFBY data
        run: |
          RUN_DATE=$(date +'%Y-%m-%d')

          python main.py \
            --year 2026 \
            --season Kharif \
            --scheme BOTH \
            --drill-to-district \
            --retries 3 \
            --output "pmfby_2026_Kharif_${RUN_DATE}.csv"

      # ----------------------------------------------------------
      # 7. Check generated CSV
      # ----------------------------------------------------------
      - name: Verify generated CSV
        run: |
          echo "Files generated:"
          ls -lh data/

          if ! ls data/*.csv 1> /dev/null 2>&1; then
            echo "ERROR: No CSV file generated."
            exit 1
          fi

      # ----------------------------------------------------------
      # 8. Save CSV as GitHub Actions artifact
      # ----------------------------------------------------------
      - name: Upload PMFBY CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmfby-weekly-data
          path: data/*.csv

      # # ----------------------------------------------------------
      # # 9. Send email
      # # ----------------------------------------------------------
      # - name: Send PMFBY report by email
      #   env:
      #     SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      #     SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}

      #   run: |
      #     python mail_pmfby_dashboard.py

      # ----------------------------------------------------------
      # 10. Commit CSV back into repository
      # ----------------------------------------------------------
      - name: Commit PMFBY CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No new PMFBY data to commit."
          else
            git commit -m "Weekly PMFBY data update"
            git push
          fi
