name: Weekly PMFBY Download

on:
  workflow_dispatch:

  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: write

jobs:
  download-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Chrome
        run: google-chrome --version

      - name: Run PMFBY download
        run: |
          RUN_DATE=$(date +'%Y-%m-%d')

          python PMFBY_Dashboard_State_Data_Download_V7.py \
            --year 2026 \
            --season Kharif \
            --scheme BOTH \
            --drill-to-district \
            --retries 3 \
            --output "pmfby_2026_kharif_${RUN_DATE}.csv"

      - name: Display generated CSV
        run: ls -lh data/

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: pmfby-weekly-data
          path: data/*.csv

      - name: Commit CSV to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Weekly PMFBY data update"
            git push
          fi
